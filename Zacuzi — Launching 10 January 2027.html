<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zacuzi — Launching 10 January 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--fg:#111;--mute:#6f6f6f;--line:#d9d9d9;--inv:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#f2f2f2;--mute:#9a9a9a;--line:#333;--inv:1}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#f2f2f2;--mute:#9a9a9a;--line:#333;--inv:1}
*{box-sizing:border-box;margin:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100%;min-height:100dvh;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
main{width:100%;max-width:880px}
.logo{background:var(--fg);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;margin:0 auto}
.logo{width:min(440px,74vw);animation:in 1.6s ease both,float 6s ease-in-out 1.6s infinite}
.slogan{margin-top:30px;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:clamp(22px,4.6vw,38px);letter-spacing:.01em;animation:in 2.2s ease both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
p.lead{margin-top:52px;font-size:clamp(18px,2.4vw,22px);font-weight:300;letter-spacing:.04em;color:var(--mute)}
.clock{margin:48px auto 0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.u{padding:clamp(18px,4vw,34px) 4px clamp(16px,3.4vw,28px);min-width:0}
.u+.u{border-left:1px solid var(--line)}
.n{display:block;font-size:clamp(30px,10.5vw,104px);font-weight:300;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.l{display:block;margin-top:14px;font-size:clamp(13px,1.6vw,16px);color:var(--mute);letter-spacing:.12em}
.date{margin-top:36px;font-size:clamp(16px,2vw,20px);font-weight:400;letter-spacing:.06em}
.live{font-size:clamp(32px,7vw,64px);font-weight:300;padding:56px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:48px}
.live a{color:inherit}
@media (max-width:480px){body{padding:20px 14px}.l{letter-spacing:.03em;font-size:12px;margin-top:10px}p.lead{margin-top:36px}.clock{margin-top:32px}.date{margin-top:26px}.slogan{margin-top:22px}}
@media (max-height:520px) and (orientation:landscape){body{padding:16px 24px}.logo{width:min(300px,40vw)}.slogan{margin-top:14px;font-size:20px}p.lead{margin-top:20px}.clock{margin-top:16px}.u{padding:12px 4px}.n{font-size:clamp(30px,8vh,56px)}.date{margin-top:14px}}
@media (min-width:1400px){main{max-width:1000px}}
[hidden]{display:none!important}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.logo{background:var(--fg);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;margin:0 auto}}
</style></head>

<div class="u"><span class="n" id="h">00</span><span class="l">hours</span></div>
<div class="u"><span class="n" id="m">00</span><span class="l">minutes</span></div>
<div class="u"><span class="n" id="s">00</span><span class="l">seconds</span></div>
</div>
<p class="date" id="date">10 January 2027</p>
<div class="live" id="live" hidden>We’re now open.</div>
</main>
<script>
// Launch moment fixed in India Standard Time so every visitor sees the same countdown.
var T=Date.parse("2027-01-10T00:00:00+05:30");
var el={d:document.getElementById("d"),h:document.getElementById("h"),m:document.getElementById("m"),s:document.getElementById("s")};
function p(x){return x<10?"0"+x:""+x}
function tick(){
var r=T-Date.now();
if(r<=0){document.getElementById("clock").hidden=true;document.getElementById("lead").hidden=true;document.getElementById("date").hidden=true;document.getElementById("live").hidden=false;clearInterval(iv);return}
var S=Math.floor(r/1000);
el.d.textContent=p(Math.floor(S/86400));el.h.textContent=p(Math.floor(S%86400/3600));el.m.textContent=p(Math.floor(S%3600/60));el.s.textContent=p(S%60);
}
tick();var iv=setInterval(tick,1000);
</script></body></html>
